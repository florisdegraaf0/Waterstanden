[project]
name = "nederland-watermonitor-backend"
version = "0.1.0"
description = "FastAPI backend for Nederland Watermonitor"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "fastapi>=0.115.0",
    "geoalchemy2>=0.15.2",
    "httpx>=0.27.2",
    "pydantic-settings>=2.4.0",
    "psycopg[binary]>=3.2.1",
    "sqlalchemy>=2.0.32",
    "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
